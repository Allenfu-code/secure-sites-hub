[project]
name = "secure-sites-hub"
version = "1.0.0"
description = "Security-conscious, read-only dashboard for self-hosted services"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pyjwt[crypto]==2.15.1",
  "python-multipart==0.0.33",
  "pyyaml==6.0.3",
  "starlette==1.10.0",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
  "httpx2==2.16.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
