[project]
name = "secure-sites-hub"
version = "1.0.0"
description = "Security-conscious, read-only dashboard for self-hosted services"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "pyyaml==6.0.3",
  "starlette==1.6.0",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
